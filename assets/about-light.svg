<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">About Ahmed Laiq</title>
<desc id="desc">Hey, I'm Ahmed. Final-year Computer Science student at FAST NUCES and software engineer intern at Fiqros, headed toward AI engineering. Building software begins long before the first line of code.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ded1d5" stroke-width="0.7"/></pattern>
 <linearGradient id="fade"><stop stop-color="#f4efe7" stop-opacity="1"/><stop offset="1" stop-color="#f4efe7" stop-opacity="0"/></linearGradient>
</defs>
<style>
 text{font-family:'DejaVu Sans',Arial,sans-serif}
 .mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
 .signal{stroke-dasharray:6 94;animation:travel 12s linear infinite}
 .cursor{animation:blink 1.3s steps(1) infinite}
 .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
 .rise{animation:rise .8s ease-out backwards}
 @keyframes travel{to{stroke-dashoffset:-100}}
 @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
 @keyframes breathe{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.18)}}
 @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 @media(prefers-reduced-motion:reduce){.signal,.cursor,.halo,.rise{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="408" rx="18" fill="#f4efe7" stroke="#ded1d5" stroke-width="2"/>
<rect x="690" y="20" width="485" height="370" fill="url(#grid)" opacity=".55"/><rect x="660" y="20" width="400" height="370" fill="url(#fade)"/>
<path d="M49 50 H79" stroke="#93032e" stroke-width="5"/><text x="94" y="56" fill="#65555e" font-size="14" letter-spacing="2.5" class="mono">01 / ABOUT</text><text x="1150" y="56" fill="#65555e" font-size="13" text-anchor="end" class="mono">HELLO, WORLD</text><text x="46" y="140" fill="#171310" font-size="66" font-weight="700" letter-spacing="-3.5">Hey, I'm Ahmed<tspan fill="#93032e">.</tspan></text><text class="rise" style="animation-delay:0.20s" x="50" y="192" fill="#171310" font-size="18">Final-year Computer Science student at FAST NUCES,</text><text class="rise" style="animation-delay:0.32s" x="50" y="221" fill="#65555e" font-size="18">and software engineer intern at Fiqros. I'm headed</text><text class="rise" style="animation-delay:0.44s" x="50" y="250" fill="#65555e" font-size="18">toward AI engineering, and I care about the systems</text><text class="rise" style="animation-delay:0.56s" x="50" y="279" fill="#65555e" font-size="18">around the model: the APIs, pipelines and</text><text class="rise" style="animation-delay:0.68s" x="50" y="308" fill="#65555e" font-size="18">infrastructure that make an idea usable.</text><rect x="50" y="338" width="4" height="34" rx="2" fill="#93032e"/><text x="68" y="360" fill="#93032e" font-size="15" class="mono">Building software begins long before</text><text x="68" y="380" fill="#93032e" font-size="15" class="mono">the first line of code.</text><rect x="700" y="80" width="450" height="300" rx="12" fill="#eee2e1" stroke="#ded1d5"/><circle cx="724" cy="102" r="5" fill="#93032e"/><circle cx="742" cy="102" r="5" fill="#93032e"/><circle cx="760" cy="102" r="5" fill="#ded1d5"/><text x="925.0" y="106" fill="#65555e" font-size="12" text-anchor="middle" class="mono">ahmed@islamabad ~</text><path d="M700 122 H1150" stroke="#ded1d5"/><text class="rise mono" style="animation-delay:.3s" x="724" y="156" font-size="15" fill="#171310"><tspan fill="#93032e">$</tspan> cat about.txt</text><g class="rise" style="animation-delay:0.50s"><text x="724" y="188" fill="#65555e" font-size="15" class="mono">role</text><text x="828" y="188" fill="#93032e" font-size="15" class="mono">SWE Intern · Fiqros</text></g><g class="rise" style="animation-delay:0.65s"><text x="724" y="219" fill="#65555e" font-size="15" class="mono">studying</text><text x="828" y="219" fill="#171310" font-size="15" class="mono">CS · FAST NUCES, final year</text></g><g class="rise" style="animation-delay:0.80s"><text x="724" y="250" fill="#65555e" font-size="15" class="mono">building</text><text x="828" y="250" fill="#171310" font-size="15" class="mono">Sonder</text></g><g class="rise" style="animation-delay:0.95s"><text x="724" y="281" fill="#65555e" font-size="15" class="mono">curious</text><text x="828" y="281" fill="#171310" font-size="15" class="mono">grounded AI, better retrieval</text></g><g class="rise" style="animation-delay:1.10s"><text x="724" y="312" fill="#65555e" font-size="15" class="mono">based</text><text x="828" y="312" fill="#171310" font-size="15" class="mono">Islamabad, PK</text></g><text x="724" y="353" fill="#93032e" font-size="15" class="mono">$</text><rect class="cursor" x="742" y="338" width="9" height="20" fill="#93032e"/>
</svg>
