<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Away from the keyboard</title>
<desc id="desc">Away from the keyboard: table tennis, swimming, watching FC Barcelona, the cinema, ranking burger joints in my city, putting effort into outfits, and designing logos and graphics, shared on Instagram at worksandwonder.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#332831" stroke-width="0.7"/></pattern>
 <linearGradient id="fade"><stop stop-color="#101014" stop-opacity="1"/><stop offset="1" stop-color="#101014" stop-opacity="0"/></linearGradient>
</defs>
<style>
 text{font-family:'DejaVu Sans',Arial,sans-serif}
 .mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
 .signal{stroke-dasharray:6 94;animation:travel 12s linear infinite}
 .cursor{animation:blink 1.3s steps(1) infinite}
 .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
 .rise{animation:rise .8s ease-out backwards}
 @keyframes travel{to{stroke-dashoffset:-100}}
 @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
 @keyframes breathe{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.18)}}
 @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 @media(prefers-reduced-motion:reduce){.signal,.cursor,.halo,.rise{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="638" rx="18" fill="#101014" stroke="#332831" stroke-width="2"/>
<rect x="700" y="20" width="475" height="600" fill="url(#grid)" opacity=".55"/><rect x="670" y="20" width="400" height="600" fill="url(#fade)"/>
<path d="M49 50 H79" stroke="#93032e" stroke-width="5"/><text x="94" y="56" fill="#b4aab0" font-size="14" letter-spacing="2.5" class="mono">06 / OFF-KEYBOARD</text><text x="46" y="124" fill="#f2efea" font-size="50" font-weight="700" letter-spacing="-2.5">Away from the keyboard<tspan fill="#ec8da9">.</tspan></text><text x="50" y="160" fill="#b4aab0" font-size="18">The things that fill the hours between commits.</text><path d="M790 140 H855 Q875 140 875 120 V100 Q875 80 895 80 H1010 Q1030 80 1030 60" stroke="#332831" stroke-width="3" fill="none"/><path class="signal" pathLength="100" d="M790 140 H855 Q875 140 875 120 V100 Q875 80 895 80 H1010 Q1030 80 1030 60" stroke="#ec8da9" stroke-width="3" fill="none" style="animation-duration:12s"/><g fill="#101014" stroke="#ec8da9" stroke-width="2"><circle cx="790" cy="140" r="8"/><circle cx="940" cy="80" r="8"/><circle cx="1030" cy="60" r="8"/></g><circle class="halo" cx="790" cy="140" r="15" fill="none" stroke="#ec8da9"/><g fill="#b4aab0" font-size="12" letter-spacing="1.5" class="mono" text-anchor="middle"><text x="790" y="118">PLAY</text><text x="940" y="58">WATCH</text><text x="1030" y="38">CREATE</text></g><rect x="50" y="212" width="260" height="186" rx="14" fill="#1c141c" stroke="#332831"/><g transform="translate(74 234)" fill="none" stroke="#ec8da9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-35 20 24)"><ellipse cx="20" cy="15" rx="12" ry="14"/><rect x="17" y="30" width="6" height="14" rx="2" fill="#ec8da9"/></g><circle cx="39" cy="36" r="4.5" fill="#ec8da9" stroke="none"/></g><text x="288" y="248" fill="#b4aab0" font-size="12" letter-spacing="2" text-anchor="end" class="mono">01</text><text x="74" y="308" fill="#f2efea" font-size="19" font-weight="700" letter-spacing="-.3">Table tennis</text><text x="74" y="334" fill="#b4aab0" font-size="13">Fast rallies, sharp</text><text x="74" y="354" fill="#b4aab0" font-size="13">reflexes. A game I</text><text x="74" y="374" fill="#b4aab0" font-size="13">really liked.</text><rect x="330" y="212" width="260" height="186" rx="14" fill="#1c141c" stroke="#332831"/><g transform="translate(354 234)" fill="none" stroke="#ec8da9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10 q5.5 -8 11 0 t11 0 t11 0 t11 0"/><path d="M2 24 q5.5 -8 11 0 t11 0 t11 0 t11 0"/><path d="M2 38 q5.5 -8 11 0 t11 0 t11 0 t11 0"/></g><text x="568" y="248" fill="#b4aab0" font-size="12" letter-spacing="2" text-anchor="end" class="mono">02</text><text x="354" y="308" fill="#f2efea" font-size="19" font-weight="700" letter-spacing="-.3">Swimming</text><text x="354" y="334" fill="#b4aab0" font-size="13">Happiest in the water.</text><text x="354" y="354" fill="#b4aab0" font-size="13">Pretty great at it, too.</text><rect x="610" y="212" width="260" height="186" rx="14" fill="#1c141c" stroke="#332831"/><g transform="translate(634 234)" fill="none" stroke="#ec8da9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><clipPath id="shield"><path d="M4 4 H42 V24 Q42 40 23 46 Q4 40 4 24 Z"/></clipPath><g clip-path="url(#shield)" stroke="none"><rect x="4.0" y="0" width="7.6" height="50" fill="#93032e"/><rect x="11.6" y="0" width="7.6" height="50" fill="#ec8da9"/><rect x="19.2" y="0" width="7.6" height="50" fill="#93032e"/><rect x="26.799999999999997" y="0" width="7.6" height="50" fill="#ec8da9"/><rect x="34.4" y="0" width="7.6" height="50" fill="#93032e"/></g><path d="M4 4 H42 V24 Q42 40 23 46 Q4 40 4 24 Z"/></g><text x="848" y="248" fill="#b4aab0" font-size="12" letter-spacing="2" text-anchor="end" class="mono">03</text><text x="634" y="308" fill="#f2efea" font-size="19" font-weight="700" letter-spacing="-.3">FC Barcelona</text><text x="634" y="334" fill="#b4aab0" font-size="13">I love watching</text><text x="634" y="354" fill="#b4aab0" font-size="13">FC Barcelona play.</text><text x="634" y="374" fill="#b4aab0" font-size="13">Visca Barça.</text><rect x="890" y="212" width="260" height="186" rx="14" fill="#1c141c" stroke="#332831"/><g transform="translate(914 234)" fill="none" stroke="#ec8da9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="42" height="30" rx="5"/><path d="M19 16 L32 23 L19 30 Z" fill="#ec8da9"/></g><text x="1128" y="248" fill="#b4aab0" font-size="12" letter-spacing="2" text-anchor="end" class="mono">04</text><text x="914" y="308" fill="#f2efea" font-size="19" font-weight="700" letter-spacing="-.3">The cinema</text><text x="914" y="334" fill="#b4aab0" font-size="13">Nothing beats a big</text><text x="914" y="354" fill="#b4aab0" font-size="13">screen and a dark room.</text><rect x="50" y="418" width="260" height="186" rx="14" fill="#1c141c" stroke="#332831"/><g transform="translate(74 440)" fill="none" stroke="#ec8da9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20 Q5 5 23 5 Q41 5 41 20 Z"/><rect x="3" y="25" width="40" height="6" rx="3" fill="#ec8da9"/><path d="M6 35 H40 Q40 43 32 43 H14 Q6 43 6 35 Z"/></g><text x="288" y="454" fill="#b4aab0" font-size="12" letter-spacing="2" text-anchor="end" class="mono">05</text><text x="74" y="514" fill="#f2efea" font-size="19" font-weight="700" letter-spacing="-.3">Burger rankings</text><text x="74" y="540" fill="#b4aab0" font-size="13">I keep a ranking of every</text><text x="74" y="560" fill="#b4aab0" font-size="13">burger joint in my city.</text><text x="74" y="580" fill="#b4aab0" font-size="13">Yes, there's a list.</text><rect x="330" y="418" width="260" height="186" rx="14" fill="#1c141c" stroke="#332831"/><g transform="translate(354 440)" fill="none" stroke="#ec8da9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 14 a4.5 4.5 0 1 1 4.5 4.5 L23 22 L3 38 H43 L23 22"/></g><text x="568" y="454" fill="#b4aab0" font-size="12" letter-spacing="2" text-anchor="end" class="mono">06</text><text x="354" y="514" fill="#f2efea" font-size="19" font-weight="700" letter-spacing="-.3">Outfits</text><text x="354" y="540" fill="#b4aab0" font-size="13">I put real effort into</text><text x="354" y="560" fill="#b4aab0" font-size="13">getting dressed.</text><rect x="610" y="418" width="540" height="186" rx="14" fill="#1c141c" stroke="#332831"/><g transform="translate(634 440)" fill="none" stroke="#ec8da9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 38 C5 4 41 4 41 38"/><rect x="1" y="34" width="8" height="8" fill="#ec8da9"/><rect x="37" y="34" width="8" height="8" fill="#ec8da9"/><circle cx="23" cy="9" r="3.5" fill="#ec8da9"/></g><text x="1128" y="454" fill="#b4aab0" font-size="12" letter-spacing="2" text-anchor="end" class="mono">07</text><text x="634" y="514" fill="#f2efea" font-size="19" font-weight="700" letter-spacing="-.3">Design</text><text x="634" y="540" fill="#b4aab0" font-size="13">Logos and graphics for my own projects, and design in</text><text x="634" y="560" fill="#b4aab0" font-size="13">general. I share them on Instagram:</text><text x="634" y="580" fill="#ec8da9" font-size="14" class="mono">@worksandwonder</text>
</svg>
