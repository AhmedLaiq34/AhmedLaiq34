<svg xmlns="http://www.w3.org/2000/svg" width="590" height="340" viewBox="0 0 590 340" role="img" aria-labelledby="title desc">
<title id="title">Axiom, rag tutor</title>
<desc id="desc">Axiom: A RAG tutor for university curricula. An academic assistant with document ingestion, local embeddings, MMR retrieval, and a dual-LLM setup for domain reasoning and OCR correction. Containerized, rate limited. Built with Flask, LangChain, ChromaDB, Redis, Docker.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#332831" stroke-width="0.7"/></pattern>
 <linearGradient id="fade"><stop stop-color="#101014" stop-opacity="1"/><stop offset="1" stop-color="#101014" stop-opacity="0"/></linearGradient>
</defs>
<style>
 text{font-family:'DejaVu Sans',Arial,sans-serif}
 .mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
 .signal{stroke-dasharray:6 94;animation:travel 12s linear infinite}
 .cursor{animation:blink 1.3s steps(1) infinite}
 .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
 .rise{animation:rise .8s ease-out backwards}
 @keyframes travel{to{stroke-dashoffset:-100}}
 @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
 @keyframes breathe{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.18)}}
 @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 @media(prefers-reduced-motion:reduce){.signal,.cursor,.halo,.rise{animation:none}}
</style>
<rect x="1" y="1" width="588" height="338" rx="18" fill="#101014" stroke="#332831" stroke-width="2"/>

<text x="30" y="46" fill="#ec8da9" font-size="14" font-weight="700" class="mono">01</text><text x="56" y="46" fill="#b4aab0" font-size="12" letter-spacing="2.5" class="mono">/ RAG TUTOR</text><text x="28" y="108" fill="#f2efea" font-size="46" font-weight="700" letter-spacing="-2">Axiom<tspan fill="#ec8da9">.</tspan></text><text x="30" y="146" fill="#ec8da9" font-size="17" font-weight="500">A RAG tutor for university curricula.</text><text x="30" y="184" fill="#b4aab0" font-size="14">An academic assistant with document ingestion, local</text><text x="30" y="207" fill="#b4aab0" font-size="14">embeddings, MMR retrieval, and a dual-LLM setup for domain</text><text x="30" y="230" fill="#b4aab0" font-size="14">reasoning and OCR correction. Containerized, rate limited.</text><rect x="30" y="256" width="58" height="26" rx="8" fill="#1c141c" stroke="#332831"/><text x="59.0" y="273.2" fill="#f2efea" font-size="12" text-anchor="middle" class="mono">Flask</text><rect x="96" y="256" width="87" height="26" rx="8" fill="#1c141c" stroke="#332831"/><text x="139.5" y="273.2" fill="#f2efea" font-size="12" text-anchor="middle" class="mono">LangChain</text><rect x="191" y="256" width="80" height="26" rx="8" fill="#1c141c" stroke="#332831"/><text x="231.0" y="273.2" fill="#f2efea" font-size="12" text-anchor="middle" class="mono">ChromaDB</text><rect x="279" y="256" width="58" height="26" rx="8" fill="#1c141c" stroke="#332831"/><text x="308.0" y="273.2" fill="#f2efea" font-size="12" text-anchor="middle" class="mono">Redis</text><rect x="345" y="256" width="65" height="26" rx="8" fill="#1c141c" stroke="#332831"/><text x="377.5" y="273.2" fill="#f2efea" font-size="12" text-anchor="middle" class="mono">Docker</text><path d="M30 306 H560" stroke="#332831"/><path class="signal" pathLength="100" d="M30 306 H560" stroke="#ec8da9" stroke-width="2" style="animation-duration:9s;animation-delay:-0s"/><text x="30" y="327" fill="#b4aab0" font-size="11" class="mono">github.com/AhmedLaiq34/Axiom</text><text x="560" y="327" fill="#ec8da9" font-size="11" letter-spacing="2" text-anchor="end" class="mono">OPEN ↗</text><rect x="1" y="1" width="588" height="338" rx="16" fill="none" stroke="#332831" stroke-width="2"/>
</svg>
