<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="872" viewBox="0 0 1200 872" role="img" aria-labelledby="title desc">
<title id="title">Experience</title>
<desc id="desc">Experience. Now: Software Engineer Intern at Fiqros. AI Engineer Intern at Intellema: FastAPI and PostgreSQL backend for an analytics SaaS, 3+ platforms unified, 20+ REST endpoints, four-stage hybrid RAG pipeline. DevOps Engineer Intern at CloudMania Solutions, July to September 2025: Azure and Terraform, 10+ cloud resources, roughly 80% less manual configuration.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ded1d5" stroke-width="0.7"/></pattern>
 <linearGradient id="fade"><stop stop-color="#f4efe7" stop-opacity="1"/><stop offset="1" stop-color="#f4efe7" stop-opacity="0"/></linearGradient>
</defs>
<style>
 text{font-family:'DejaVu Sans',Arial,sans-serif}
 .mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
 .signal{stroke-dasharray:6 94;animation:travel 12s linear infinite}
 .cursor{animation:blink 1.3s steps(1) infinite}
 .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
 .rise{animation:rise .8s ease-out backwards}
 @keyframes travel{to{stroke-dashoffset:-100}}
 @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
 @keyframes breathe{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.18)}}
 @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 @media(prefers-reduced-motion:reduce){.signal,.cursor,.halo,.rise{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="870" rx="18" fill="#f4efe7" stroke="#ded1d5" stroke-width="2"/>
<rect x="700" y="20" width="475" height="832" fill="url(#grid)" opacity=".55"/><rect x="670" y="20" width="400" height="832" fill="url(#fade)"/>
<path d="M49 50 H79" stroke="#93032e" stroke-width="5"/><text x="94" y="56" fill="#65555e" font-size="14" letter-spacing="2.5" class="mono">02 / EXPERIENCE</text><text x="46" y="124" fill="#171310" font-size="50" font-weight="700" letter-spacing="-2.5">Where I've worked<tspan fill="#93032e">.</tspan></text><text x="50" y="160" fill="#65555e" font-size="18">Interning across product engineering, AI and cloud.</text><path d="M790 140 H855 Q875 140 875 120 V100 Q875 80 895 80 H1010 Q1030 80 1030 60" stroke="#ded1d5" stroke-width="3" fill="none"/><path class="signal" pathLength="100" d="M790 140 H855 Q875 140 875 120 V100 Q875 80 895 80 H1010 Q1030 80 1030 60" stroke="#93032e" stroke-width="3" fill="none" style="animation-duration:12s"/><g fill="#f4efe7" stroke="#93032e" stroke-width="2"><circle cx="790" cy="140" r="8"/><circle cx="940" cy="80" r="8"/><circle cx="1030" cy="60" r="8"/></g><circle class="halo" cx="790" cy="140" r="15" fill="none" stroke="#93032e"/><g fill="#65555e" font-size="12" letter-spacing="1.5" class="mono" text-anchor="middle"><text x="790" y="118">IDEAS</text><text x="940" y="58">SYSTEMS</text><text x="1030" y="38">IMPACT</text></g><rect x="130" y="215" width="1020" height="120" rx="14" fill="#eee2e1" stroke="#93032e" stroke-width="2"/><rect x="158" y="233" width="64" height="24" rx="12" fill="#93032e"/><circle cx="174" cy="245" r="3.5" fill="#f4efe7"/><text x="184" y="249.5" fill="#f4efe7" font-size="12" font-weight="700" letter-spacing="1.5" class="mono">NOW</text><text x="1122" y="250" fill="#65555e" font-size="13" letter-spacing="2" text-anchor="end" class="mono">PRESENT</text><text x="158" y="291" fill="#171310" font-size="26" font-weight="700" letter-spacing="-.5">Software Engineer Intern<tspan fill="#93032e" font-weight="500"> · Fiqros</tspan></text><text x="158" y="317" fill="#65555e" font-size="16">Working inside a real engineering team while finishing my final year at FAST.</text><rect x="130" y="363" width="1020" height="244" rx="14" fill="#eee2e1" stroke="#ded1d5" stroke-width="1"/><text x="1122" y="401" fill="#65555e" font-size="13" letter-spacing="2" text-anchor="end" class="mono">ANALYTICS SAAS</text><text x="158" y="409" fill="#171310" font-size="26" font-weight="700" letter-spacing="-.5">AI Engineer Intern<tspan fill="#93032e" font-weight="500"> · Intellema</tspan></text><text x="158" y="443" fill="#65555e" font-size="16">Built backend services and ingestion pipelines with FastAPI and PostgreSQL,</text><text x="158" y="467" fill="#65555e" font-size="16">unifying exports from 3+ platforms behind a REST API.</text><rect x="160" y="493" width="6" height="6" fill="#93032e"/><text x="178" y="501" fill="#65555e" font-size="15">Designed a four-stage hybrid RAG pipeline: dense retrieval, BM25, RRF and reranking.</text><rect x="160" y="517" width="6" height="6" fill="#93032e"/><text x="178" y="525" fill="#65555e" font-size="15">Led stakeholder meetings and presented technical work to client executives.</text><path d="M158 545 H1122" stroke="#ded1d5"/><text x="158" y="581" fill="#93032e" font-size="32" font-weight="700" letter-spacing="-1">3+</text><text x="158" y="601" fill="#65555e" font-size="11" letter-spacing="1.5" class="mono">PLATFORMS UNIFIED</text><text x="420" y="581" fill="#93032e" font-size="32" font-weight="700" letter-spacing="-1">20+</text><text x="420" y="601" fill="#65555e" font-size="11" letter-spacing="1.5" class="mono">REST ENDPOINTS</text><text x="680" y="581" fill="#93032e" font-size="32" font-weight="700" letter-spacing="-1">4</text><text x="680" y="601" fill="#65555e" font-size="11" letter-spacing="1.5" class="mono">STAGE HYBRID RAG</text><text x="940" y="581" fill="#93032e" font-size="32" font-weight="700" letter-spacing="-1">Async</text><text x="940" y="601" fill="#65555e" font-size="11" letter-spacing="1.5" class="mono">DOCKERIZED WORKERS</text><rect x="130" y="635" width="1020" height="196" rx="14" fill="#eee2e1" stroke="#ded1d5" stroke-width="1"/><text x="1122" y="673" fill="#65555e" font-size="13" letter-spacing="2" text-anchor="end" class="mono">JUL – SEP 2025</text><text x="158" y="681" fill="#171310" font-size="26" font-weight="700" letter-spacing="-.5">DevOps Engineer Intern<tspan fill="#93032e" font-weight="500"> · CloudMania Solutions</tspan></text><text x="158" y="715" fill="#65555e" font-size="16">Azure infrastructure and Terraform automation: provisioning and managing</text><text x="158" y="739" fill="#65555e" font-size="16">cloud resources and streamlining deployment workflows.</text><path d="M158 759 H1122" stroke="#ded1d5"/><text x="158" y="795" fill="#93032e" font-size="32" font-weight="700" letter-spacing="-1">10+</text><text x="158" y="815" fill="#65555e" font-size="11" letter-spacing="1.5" class="mono">CLOUD RESOURCES</text><text x="420" y="795" fill="#93032e" font-size="32" font-weight="700" letter-spacing="-1">~80%</text><text x="420" y="815" fill="#65555e" font-size="11" letter-spacing="1.5" class="mono">LESS MANUAL CONFIG (EST.)</text><path d="M80 251 V671" stroke="#ded1d5" stroke-width="3" fill="none"/><path class="signal" pathLength="100" d="M80 251 V671" stroke="#93032e" stroke-width="3" fill="none" style="animation-duration:14s"/><g fill="#f4efe7" stroke="#93032e" stroke-width="2"><circle cx="80" cy="251" r="8"/><circle cx="80" cy="399" r="8"/><circle cx="80" cy="671" r="8"/></g><circle class="halo" cx="80" cy="251" r="15" fill="none" stroke="#93032e"/><path d="M88 251 H130" stroke="#ded1d5" stroke-width="2"/><path d="M88 399 H130" stroke="#ded1d5" stroke-width="2"/><path d="M88 671 H130" stroke="#ded1d5" stroke-width="2"/>
</svg>
