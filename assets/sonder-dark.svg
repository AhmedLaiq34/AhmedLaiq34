<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Sonder, currently building</title>
<desc id="desc">Currently building Sonder, a final year project at FAST School of Computing. Most learning tools tell a student they got it wrong. Sonder finds out why: it diagnoses the misunderstanding behind a wrong answer, gives a targeted activity, and checks later that it stuck.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#332831" stroke-width="0.7"/></pattern>
 <linearGradient id="fade"><stop stop-color="#101014" stop-opacity="1"/><stop offset="1" stop-color="#101014" stop-opacity="0"/></linearGradient>
</defs>
<style>
 text{font-family:'DejaVu Sans',Arial,sans-serif}
 .mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
 .signal{stroke-dasharray:6 94;animation:travel 12s linear infinite}
 .cursor{animation:blink 1.3s steps(1) infinite}
 .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
 .rise{animation:rise .8s ease-out backwards}
 @keyframes travel{to{stroke-dashoffset:-100}}
 @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
 @keyframes breathe{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.18)}}
 @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 @media(prefers-reduced-motion:reduce){.signal,.cursor,.halo,.rise{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="468" rx="18" fill="#101014" stroke="#332831" stroke-width="2"/>
<rect x="700" y="20" width="475" height="430" fill="url(#grid)" opacity=".55"/><rect x="670" y="20" width="400" height="430" fill="url(#fade)"/>
<path d="M49 50 H79" stroke="#93032e" stroke-width="5"/><text x="94" y="56" fill="#b4aab0" font-size="14" letter-spacing="2.5" class="mono">03 / NOW BUILDING</text><text x="46" y="196" fill="#f2efea" font-size="112" font-weight="700" letter-spacing="-6">Sonder<tspan fill="#ec8da9">.</tspan></text><text x="50" y="254" fill="#b4aab0" font-size="23">Most learning tools tell a student</text><text x="50" y="286" fill="#b4aab0" font-size="23">they got it wrong.</text><text x="50" y="334" fill="#ec8da9" font-size="30" font-weight="700">Sonder finds out why.</text><rect x="50" y="376" width="152" height="28" rx="8" fill="#1c141c" stroke="#332831"/><text x="126.0" y="394.2" fill="#f2efea" font-size="12" text-anchor="middle" class="mono">FINAL YEAR PROJECT</text><rect x="212" y="376" width="195" height="28" rx="8" fill="#1c141c" stroke="#332831"/><text x="309.5" y="394.2" fill="#f2efea" font-size="12" text-anchor="middle" class="mono">FAST SCHOOL OF COMPUTING</text><rect x="417" y="376" width="116" height="28" rx="8" fill="#1c141c" stroke="#332831"/><text x="475.0" y="394.2" fill="#f2efea" font-size="12" text-anchor="middle" class="mono">TEAM OF THREE</text><path d="M760 120 H820 Q840 120 840 140 V170 Q840 190 860 190 H960 Q980 190 980 210 V250 Q980 270 1000 270 H1060 Q1080 270 1080 290 V340" stroke="#332831" stroke-width="3" fill="none"/><path class="signal" pathLength="100" d="M760 120 H820 Q840 120 840 140 V170 Q840 190 860 190 H960 Q980 190 980 210 V250 Q980 270 1000 270 H1060 Q1080 270 1080 290 V340" stroke="#ec8da9" stroke-width="3" fill="none" style="animation-duration:10s"/><g fill="#101014" stroke="#ec8da9" stroke-width="2"><circle cx="760" cy="120" r="8"/><circle cx="900" cy="190" r="8"/><circle cx="1030" cy="270" r="8"/><circle cx="1080" cy="340" r="8"/></g><circle class="halo" cx="760" cy="120" r="15" fill="none" stroke="#ec8da9"/><text x="752" y="96" fill="#b4aab0" font-size="12" letter-spacing="1.5" class="mono">1 · WRONG ANSWER</text><text x="900" y="222" fill="#b4aab0" font-size="12" letter-spacing="1.5" class="mono" text-anchor="middle">2 · FIND THE WHY</text><text x="1042" y="302" fill="#b4aab0" font-size="12" letter-spacing="1.5" class="mono" text-anchor="end">3 · TARGETED ACTIVITY</text><text x="1080" y="372" fill="#b4aab0" font-size="12" letter-spacing="1.5" class="mono" text-anchor="middle">4 · DID IT STICK?</text><rect x="857" y="412" width="145" height="28" rx="8" fill="#1c141c" stroke="#332831"/><text x="929.5" y="430.2" fill="#f2efea" font-size="12" text-anchor="middle" class="mono">TRANSPARENT LOGIC</text><rect x="1012" y="412" width="138" height="28" rx="8" fill="#1c141c" stroke="#332831"/><text x="1081.0" y="430.2" fill="#f2efea" font-size="12" text-anchor="middle" class="mono">TEACHER-APPROVED</text>
</svg>
