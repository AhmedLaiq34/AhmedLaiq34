<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Toolbox</title>
<desc id="desc">Toolbox. Languages: Python, C++, SQL, Kotlin, PHP, JavaScript. Ai &amp; Retrieval: LangChain, Hugging Face, ChromaDB, Pandas, embeddings, hybrid search, reranking; Backend &amp; Data: FastAPI, Flask, REST APIs, PostgreSQL, MySQL, Redis; Mobile &amp; Realtime: Android, Kotlin/XML, Firebase, Node.js; Cloud &amp; Delivery: Azure, Terraform, Docker, Git, GitHub, CI/CD. Also explored: C#, Flutter, Express.js, MongoDB, SQLite, Supabase, NumPy, scikit-learn, PyTorch, TensorFlow, Matplotlib, Figma.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ded1d5" stroke-width="0.7"/></pattern>
 <linearGradient id="fade"><stop stop-color="#f4efe7" stop-opacity="1"/><stop offset="1" stop-color="#f4efe7" stop-opacity="0"/></linearGradient>
</defs>
<style>
 text{font-family:'DejaVu Sans',Arial,sans-serif}
 .mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
 .signal{stroke-dasharray:6 94;animation:travel 12s linear infinite}
 .cursor{animation:blink 1.3s steps(1) infinite}
 .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
 .rise{animation:rise .8s ease-out backwards}
 @keyframes travel{to{stroke-dashoffset:-100}}
 @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
 @keyframes breathe{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.18)}}
 @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 @media(prefers-reduced-motion:reduce){.signal,.cursor,.halo,.rise{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="588" rx="18" fill="#f4efe7" stroke="#ded1d5" stroke-width="2"/>
<rect x="700" y="20" width="475" height="550" fill="url(#grid)" opacity=".55"/><rect x="670" y="20" width="400" height="550" fill="url(#fade)"/>
