<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
<title id="title">Say hello</title>
<desc id="desc">Have a problem worth building for? I'd love to hear about it. Email ahmedlaiq2004@gmail.com.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ded1d5" stroke-width="0.7"/></pattern>
 <linearGradient id="fade"><stop stop-color="#f4efe7" stop-opacity="1"/><stop offset="1" stop-color="#f4efe7" stop-opacity="0"/></linearGradient>
</defs>
<style>
 text{font-family:'DejaVu Sans',Arial,sans-serif}
 .mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
 .signal{stroke-dasharray:6 94;animation:travel 12s linear infinite}
 .cursor{animation:blink 1.3s steps(1) infinite}
 .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
 .rise{animation:rise .8s ease-out backwards}
 @keyframes travel{to{stroke-dashoffset:-100}}
 @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
 @keyframes breathe{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.18)}}
 @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 @media(prefers-reduced-motion:reduce){.signal,.cursor,.halo,.rise{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="288" rx="18" fill="#f4efe7" stroke="#ded1d5" stroke-width="2"/>
<rect x="700" y="20" width="475" height="250" fill="url(#grid)" opacity=".55"/><rect x="670" y="20" width="400" height="250" fill="url(#fade)"/>
<path d="M49 50 H79" stroke="#93032e" stroke-width="5"/><text x="94" y="56" fill="#65555e" font-size="14" letter-spacing="2.5" class="mono">08 / SAY HELLO</text><text x="46" y="128" fill="#171310" font-size="42" font-weight="700" letter-spacing="-2">Have a problem worth building for?</text><text x="50" y="176" fill="#93032e" font-size="28" font-weight="500">I'd love to hear about it.</text><rect x="50" y="206" width="500" height="46" rx="8" fill="#eee2e1" stroke="#ded1d5"/><text x="69" y="236" fill="#93032e" font-size="17" class="mono">&gt;</text><text x="96" y="236" fill="#171310" font-size="17" class="mono">ahmedlaiq2004@gmail.com</text><rect class="cursor" x="321" y="220" width="9" height="21" fill="#93032e"/><path d="M830 150 H885 Q905 150 905 170 V190 Q905 210 925 210 H1020 Q1040 210 1040 230 V236" stroke="#ded1d5" stroke-width="3" fill="none"/><path class="signal" pathLength="100" d="M830 150 H885 Q905 150 905 170 V190 Q905 210 925 210 H1020 Q1040 210 1040 230 V236" stroke="#93032e" stroke-width="3" fill="none" style="animation-duration:12s"/><g fill="#f4efe7" stroke="#93032e" stroke-width="2"><circle cx="830" cy="150" r="8"/><circle cx="960" cy="210" r="8"/><circle cx="1040" cy="236" r="8"/></g><circle class="halo" cx="830" cy="150" r="15" fill="none" stroke="#93032e"/><text x="830" y="124" fill="#65555e" font-size="12" letter-spacing="1.5" class="mono" text-anchor="middle">A PROBLEM</text><text x="960" y="182" fill="#65555e" font-size="12" letter-spacing="1.5" class="mono" text-anchor="middle">A CONVERSATION</text><text x="1040" y="266" fill="#65555e" font-size="12" letter-spacing="1.5" class="mono" text-anchor="middle">SOMETHING USEFUL</text>
</svg>
