<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Ahmed Laiq | AI engineering and backend systems</title>
<desc id="desc">A warm editorial banner with burgundy accents, a blinking terminal cursor, and an animated path connecting ideas, systems, and impact. Islamabad, Pakistan.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#332831" stroke-width="0.7"/></pattern>
 <linearGradient id="fade"><stop stop-color="#101014" stop-opacity="1"/><stop offset="1" stop-color="#101014" stop-opacity="0"/></linearGradient>
</defs>
<style>
 text{font-family:'DejaVu Sans',Arial,sans-serif}
 .mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
 .signal{stroke-dasharray:6 220;animation:travel 12s linear infinite}
 .cursor{animation:blink 1.3s steps(1) infinite}
 .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
 @keyframes travel{to{stroke-dashoffset:-904}}
 @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
 @keyframes breathe{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.18)}}
 @media(prefers-reduced-motion:reduce){.signal,.cursor,.halo{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="418" rx="18" fill="#101014" stroke="#332831" stroke-width="2"/>
<rect x="680" y="20" width="495" height="380" fill="url(#grid)" opacity=".55"/>
<rect x="650" y="20" width="400" height="380" fill="url(#fade)"/>
<path d="M49 50 H79" stroke="#93032e" stroke-width="5"/>
<text x="94" y="56" fill="#b4aab0" font-size="14" letter-spacing="2.5" class="mono">ENGINEERING / WITH INTENT</text>
<text x="1150" y="56" fill="#b4aab0" font-size="13" text-anchor="end" class="mono">ISLAMABAD, PK</text>
<text x="46" y="164" fill="#f2efea" font-size="86" font-weight="700" letter-spacing="-5">Ahmed Laiq<tspan fill="#ec8da9">.</tspan></text>
<text x="50" y="214" fill="#ec8da9" font-size="23" font-weight="500">AI engineering. Backend systems.</text>
<text x="50" y="250" fill="#b4aab0" font-size="20">Curious about the model. Invested in the whole system.</text>
<rect x="50" y="282" width="584" height="46" rx="8" fill="#1c141c" stroke="#332831"/>
<text x="69" y="312" fill="#ec8da9" font-size="17" class="mono">&gt;</text>
<text x="96" y="312" fill="#f2efea" font-size="17" class="mono">turning ideas into useful software</text>
<rect class="cursor" x="457" y="296" width="9" height="21" fill="#ec8da9"/>
<path d="M790 150 H855 Q875 150 875 170 V228 Q875 248 895 248 H1010 Q1030 248 1030 268 V318" stroke="#332831" stroke-width="3" fill="none"/>
<path class="signal" d="M790 150 H855 Q875 150 875 170 V228 Q875 248 895 248 H1010 Q1030 248 1030 268 V318" stroke="#ec8da9" stroke-width="3" fill="none"/>
<g fill="#101014" stroke="#ec8da9" stroke-width="2"><circle cx="790" cy="150" r="8"/><circle cx="920" cy="248" r="8"/><circle cx="1030" cy="318" r="8"/></g>
<circle class="halo" cx="790" cy="150" r="15" fill="none" stroke="#ec8da9"/>
<g fill="#b4aab0" font-size="12" letter-spacing="1.5" class="mono"><text x="768" y="123">IDEAS</text><text x="891" y="219">SYSTEMS</text><text x="1005" y="356">IMPACT</text></g>
<path d="M50 361 H680" stroke="#332831"/>
<circle class="halo" cx="56" cy="387" r="9" fill="none" stroke="#ec8da9"/><circle cx="56" cy="387" r="4" fill="#ec8da9"/><text x="76" y="391" fill="#b4aab0" font-size="13" class="mono">SWE INTERN @ FIQROS  /  FAST NUCES</text>
<text x="1150" y="391" fill="#ec8da9" font-size="13" text-anchor="end" class="mono">ahmedlaiq.me</text>
</svg>